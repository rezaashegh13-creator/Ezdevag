<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>همسریابی | ازدواج</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    @font-face { font-family: 'IRANSans'; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2'); }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IRANSans', sans-serif; }
    body { background: #fdfaf6; color: #333; min-height: 100vh; padding: 16px; }
    .app-container { max-width: 800px; margin: 0 auto; }
    
    /* هدر و دکمه‌ها */
    header { background: #fff; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #ffe4d6; }
    .logo-icon { font-size: 40px; }
    h1 { color: #d1584c; margin-top: 10px; font-size: 1.5rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-top: 5px; }
    
    .glow-btn { 
      display: block; width: 100%; padding: 15px; background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); 
      color: #d1584c; text-align: center; border-radius: 15px; text-decoration: none; font-weight: bold; 
      margin-top: 15px; box-shadow: 0 0 15px rgba(255, 154, 158, 0.6); animation: glow 2s infinite alternate; 
    }
    @keyframes glow { from { box-shadow: 0 0 10px #ff9a9e; } to { box-shadow: 0 0 25px #ff9a9e; } }
    
    .contact-admin { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .contact-btn { padding: 10px 20px; border-radius: 10px; text-decoration: none; color: white; font-size: 0.9rem; }
    .eitaa { background: #f39c12; }
    .telegram { background: #0088cc; }

    /* فرم‌ها */
    .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #ffe4d6; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; outline: none; }
    .form-group input:focus { border-color: #d1584c; }
    
    .btn-submit { width: 100%; padding: 15px; background: #d1584c; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    
    /* پنل مدیریت */
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .admin-tab { flex: 1; padding: 10px; background: #eee; border-radius: 10px; text-align: center; cursor: pointer; }
    .admin-tab.active { background: #d1584c; color: white; }

    /* کارت‌های نمایش پروفایل */
    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .profile-card { background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #eee; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; color: white; margin-bottom: 10px; }
    .badge.silver { background: #bdc3c7; }
    .badge.gold { background: #f1c40f; color: #333; }
    .badge.pending { background: #e74c3c; }
    
    .profile-field { font-size: 0.85rem; color: #555; margin-bottom: 5px; }
    .profile-field strong { color: #333; }
    
    .contact-info-admin { background: #fff3cd; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 0.8rem; border: 1px solid #ffeeba; }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- هدر اصلی -->
    <header>
      <div class="logo-icon">💍</div>
      <h1>پلتفرم ازدواج و همسریابی</h1>
      <div class="subtitle">با مدیریت و تاییدیه مستقیم ادمین</div>
      
      <a href="http://eitaa.com/joinchat/878706709C93902231a1" class="glow-btn" target="_blank">✨ لمس کن برای رشد ✨</a>
      
      <div class="contact-admin">
        <span style="font-size: 0.8rem; color: #888; width: 100%; margin-bottom: 5px;">ارتباط با ادمین:</span>
        <a href="https://eitaa.com/Moarrefezdvaj" class="contact-btn eitaa" target="_blank">ایتا</a>
        <a href="https://t.me/Moarrefezdvaj" class="contact-btn telegram" target="_blank">تلگرام</a>
      </div>
    </header>

    <!-- منوی انتخاب -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button onclick="showSection('register')" class="btn-submit" style="background: #3498db;">ثبت‌نام / ویرایش فرم</button>
      <button onclick="showSection('view')" class="btn-submit" style="background: #2ecc71;">مشاهده پروفایل‌ها</button>
      <button onclick="showSection('admin')" class="btn-submit" style="background: #8e44ad;">ورود مدیر</button>
    </div>

    <!-- بخش ۱: فرم ثبت‌نام -->
    <div id="section-register" class="card">
      <h2 style="margin-bottom: 15px; color: #d1584c;">تکمیل فرم اطلاعات</h2>
      <form id="profileForm">
        <div class="form-group">
          <label>جنسیت</label>
          <select id="role" required>
            <option value="man">داماد (آقا)</option>
            <option value="woman">عروس (خانم)</option>
          </select>
        </div>
        <div class="form-group"><label>نام کوچک</label><input type="text" id="first_name" required></div>
        <div class="form-group"><label>سن</label><input type="text" id="age" required></div>
        <div class="form-group"><label>شهر سکونت</label><input type="text" id="city" required></div>
        <div class="form-group"><label>شغل</label><input type="text" id="job"></div>
        <div class="form-group"><label>تحصیلات</label><input type="text" id="education"></div>
        <div class="form-group"><label>وضعیت مالی</label><textarea id="finance" rows="2"></textarea></div>
        <div class="form-group"><label>قد و وزن</label><input type="text" id="height_weight"></div>
        <div class="form-group"><label>ملاک‌های انتخاب همسر</label><textarea id="criteria" rows="2"></textarea></div>
        <div class="form-group"><label>درخواست آشنایی از شهر</label><input type="text" id="request_city"></div>
        <div class="form-group"><label>روحیات و اخلاق</label><textarea id="mood" rows="2"></textarea></div>
        <div class="form-group"><label>شماره تماس (مخفی می‌ماند)</label><input type="text" id="phone"></div>
        <div class="form-group"><label>آیدی پیام‌رسان (مخفی می‌ماند)</label><input type="text" id="contact_id"></div>
        
        <button type="submit" class="btn-submit">ارسال برای تایید مدیر</button>
      </form>
    </div>

    <!-- بخش ۲: مشاهده پروفایل‌ها -->
    <div id="section-view" class="card" style="display: none;">
      <h2 style="margin-bottom: 15px; color: #2ecc71;">مشاهده پروفایل‌ها</h2>
      <div class="form-group">
        <label>جستجو بر اساس شهر</label>
        <input type="text" id="searchCity" placeholder="نام شهر..." onkeyup="filterProfiles()">
      </div>
      <div id="profilesGrid" class="grid"></div>
    </div>

    <!-- بخش ۳: پنل مدیریت -->
    <div id="section-admin" class="card admin-panel">
      <h2 style="margin-bottom: 15px; color: #8e44ad;">پنل مدیریت</h2>
      
      <div id="adminLogin">
        <div class="form-group">
          <label>رمز عبور مدیر</label>
          <input type="password" id="adminPass">
        </div>
        <button onclick="loginAdmin()" class="btn-submit">ورود</button>
      </div>

      <div id="adminDashboard" style="display: none;">
        <div class="admin-tabs">
          <div class="admin-tab active" onclick="filterAdmin('pending')">صف انتظار</div>
          <div class="admin-tab" onclick="filterAdmin('silver')">نقره‌ای‌ها</div>
          <div class="admin-tab" onclick="filterAdmin('gold')">طلایی‌ها</div>
        </div>
        <div id="adminList" class="grid"></div>
      </div>
    </div>

  </div>

  <script>
    // اطلاعات اتصال به دیتابیس
    const supabaseUrl = 'https://tfvzyzhfzkyjohuapfzm.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmdnp5emhmemt5am9odWFwZnptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NzY4MjAsImV4cCI6MjEwODA1MjgyMH0.IR_6UQUlmtGgxS2tRPH_vcdIMLpyO8xUsFUTKWXWuLY'; 
    
    let allProfiles = [];
    let isAdmin = false;
    let currentAdminFilter = 'pending';

    // تغییر بخش‌ها
    function showSection(section) {
      document.getElementById('section-register').style.display = 'none';
      document.getElementById('section-view').style.display = 'none';
      document.getElementById('section-admin').style.display = 'none';
      
      if (section === 'register') document.getElementById('section-register').style.display = 'block';
      if (section === 'view') { document.getElementById('section-view').style.display = 'block'; fetchProfiles(); }
      if (section === 'admin') document.getElementById('section-admin').style.display = 'block';
    }

    // ثبت‌نام
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newProfile = {
        role: document.getElementById('role').value,
        first_name: document.getElementById('first_name').value,
        age: document.getElementById('age').value,
        city: document.getElementById('city').value,
        job: document.getElementById('job').value,
        education: document.getElementById('education').value,
        finance: document.getElementById('finance').value,
        height_weight: document.getElementById('height_weight').value,
        criteria: document.getElementById('criteria').value,
        request_city: document.getElementById('request_city').value,
        mood: document.getElementById('mood').value,
        phone: document.getElementById('phone').value,
        contact_id: document.getElementById('contact_id').value,
        status: 'pending' // همه در ابتدا در صف انتظار هستند
      };

      try {
        const res = await fetch(supabaseUrl + '/rest/v1/profiles', {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify(newProfile)
        });
        if (res.ok) {
          alert('اطلاعات با موفقیت ثبت شد. پس از تایید مدیر نمایش داده می‌شود.');
          document.getElementById('profileForm').reset();
          showSection('view');
        }
      } catch (err) { alert('خطا در ثبت: ' + err.message); }
    });

    // دریافت اطلاعات
    async function fetchProfiles() {
      try {
        const res = await fetch(supabaseUrl + '/rest/v1/profiles?select=*&order=id.desc', {
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
        });
        allProfiles = await res.json();
        renderPublicProfiles();
        if (isAdmin) renderAdminList();
      } catch (err) { console.error(err); }
    }

    // نمایش برای کاربران عادی (فقط نقره‌ای و طلایی)
    function renderPublicProfiles() {
      const grid = document.getElementById('profilesGrid');
      grid.innerHTML = '';
      
      const visibleProfiles = allProfiles.filter(p => p.status === 'silver' || p.status === 'gold');
      
      if (visibleProfiles.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#888;">هیچ پروفایل تایید شده‌ای برای نمایش وجود ندارد.</p>';
        return;
      }

      visibleProfiles.forEach(p => {
        const badgeClass = p.status === 'gold' ? 'gold' : 'silver';
        const badgeText = p.status === 'gold' ? '🌟 طلایی' : '🥈 نقره‌ای';
        
        // عکس فقط برای طلایی‌ها (فعلاً جایش خالی است)
        const photoHtml = p.status === 'gold' ? '<div style="height:100px; background:#eee; border-radius:10px; margin-bottom:10px;">عکس (فقط طلایی)</div>' : '<div style="height:100px; background:#f9f9f9; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; color:#aaa;">🔒 عکس مخفی است</div>';

        grid.innerHTML += `
          <div class="profile-card">
            <span class="badge ${badgeClass}">${badgeText}</span>
            ${photoHtml}
            <h3 style="color:#d1584c; margin-bottom:10px;">${p.first_name} (${p.age} ساله)</h3>
            <div class="profile-field"><strong>شهر:</strong> ${p.city}</div>
            <div class="profile-field"><strong>شغل:</strong> ${p.job || 'ذکر نشده'}</div>
            <div class="profile-field"><strong>تحصیلات:</strong> ${p.education || 'ذکر نشده'}</div>
            <div class="profile-field"><strong>ملاک:</strong> ${p.criteria || 'ذکر نشده'}</div>
          </div>
        `;
      });
    }

    // --- بخش مدیریت ---
    function loginAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === 'Reza6625') {
        isAdmin = true;
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        fetchProfiles();
      } else {
        alert('رمز عبور اشتباه است!');
      }
    }

    function filterAdmin(status) {
      currentAdminFilter = status;
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderAdminList();
    }

    function renderAdminList() {
      const list = document.getElementById('adminList');
      list.innerHTML = '';
      
      const filtered = allProfiles.filter(p => p.status === currentAdminFilter);
      
      if (filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#888;">لیست خالی است.</p>';
        return;
      }

      filtered.forEach(p => {
        list.innerHTML += `
          <div class="profile-card" style="border: 2px solid #8e44ad;">
            <h3>${p.first_name} (${p.role === 'man' ? 'آقا' : 'خانم'}) - ${p.age} ساله</h3>
            <div class="profile-field"><strong>شهر:</strong> ${p.city} | <strong>شغل:</strong> ${p.job}</div>
            
            <div class="contact-info-admin">
              <strong>اطلاعات محرمانه (فقط مدیر):</strong><br>
              شماره تماس: ${p.phone || 'ندارد'}<br>
              آیدی پیام‌رسان: ${p.contact_id || 'ندارد'}
            </div>

            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
              ${p.status === 'pending' ? `<button onclick="updateStatus(${p.id}, 'silver')" style="background:#bdc3c7; color:white; border:none; padding:8px 15px; border-radius:5px;">تبدیل به نقره‌ای</button>` : ''}
              ${p.status === 'silver' ? `<button onclick="updateStatus(${p.id}, 'gold')" style="background:#f1c40f; color:#333; border:none; padding:8px 15px; border-radius:5px;">ارتقا به طلایی</button>` : ''}
              <button onclick="deleteProfile(${p.id})" style="background:#e74c3c; color:white; border:none; padding:8px 15px; border-radius:5px;">حذف</button>
            </div>
          </div>
        `;
      });
    }

    async function updateStatus(id, newStatus) {
      try {
        await fetch(supabaseUrl + '/rest/v1/profiles?id=eq.' + id, {
          method: 'PATCH',
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        fetchProfiles();
      } catch (err) { alert('خطا در تغییر وضعیت'); }
    }

    async function deleteProfile(id) {
      if (!confirm('آیا مطمئن هستید؟')) return;
      try {
        await fetch(supabaseUrl + '/rest/v1/profiles?id=eq.' + id, {
          method: 'DELETE',
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
        });
        fetchProfiles();
      } catch (err) { alert('خطا در حذف'); }
    }
    
    // فیلتر جستجو
    function filterProfiles() {
      const query = document.getElementById('searchCity').value;
      const cards = document.querySelectorAll('#profilesGrid .profile-card');
      cards.forEach(card => {
        if (card.innerText.includes(query)) card.style.display = 'block';
        else card.style.display = 'none';
      });
    }

    // شروع
    fetchProfiles();
  </script>
</body>
</html>
